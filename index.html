    const firebaseConfig = parseWindowJson(typeof window.__firebase_config !== 'undefined' ? window.__firebase_config : null, {});

        app = initializeApp(firebaseConfig);

    const normalizeEgpPrice = (val, fallback = 950) => {
      const num = Number(val);
      if (!num || isNaN(num)) return fallback;
      if (num < 100) return Math.round((num * 38) / 25) * 25;
      return Math.round(num);
    };

    const formatEGP = (val, lang = 'ar') => {
      const amount = normalizeEgpPrice(val, 0);
      if (lang === 'en') {
        return `${amount.toLocaleString('en-US')} EGP`;
      }
      return `${amount.toLocaleString('ar-EG')} ج.م`;
