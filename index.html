    const extractCleanPhoneNumber = (rawInput) => {
      let val = (rawInput || '').trim();

        try {
          const saved = JSON.parse(localStorage.getItem('bonka_local_settings') || 'null');
          if (saved && saved.whatsappNumber) val = saved.whatsappNumber.trim();

        return DEFAULT_WHATSAPP_NUMBER;
      }
      // If user pasted a wa.me/201... link, extract the digits
      const digitsOnly = val.replace(/[^0-9]/g, '');
      if (digitsOnly.length >= 10) {
        if (digitsOnly.startsWith('00')) return digitsOnly.slice(2);
        if (digitsOnly.startsWith('01') && digitsOnly.length === 11) return `2${digitsOnly}`;
        return digitsOnly;
      }
      return DEFAULT_WHATSAPP_NUMBER;
    };

    // Compress uploaded receipt image for fast storage & cloud upload
    const compressReceiptImage = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 900;
            const scale = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            canvas.toBlob(
              (blob) => resolve({ dataUrl, blob }),
              'image/jpeg',
              0.8
            );
          };
          img.onerror = reject;
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    };

        const form1 = new FormData();
        form1.append('reqtype', 'fileupload');
        form1.append('time', '72h');
        form1.append('fileToUpload', blob, filename);
        const res1 = await fetch('https://litterbox.catbox.moe/resources/internals/api.php', {
          method: 'POST',
          body: form1
        });
        if (res1.ok) {
          const textUrl = (await res1.text()).trim();
          if (textUrl.startsWith('http')) return textUrl;
        }
      } catch (e) {}

      try {
        const form2 = new FormData();
        form2.append('file', blob, filename);
        const res2 = await fetch('https://tmpfiles.org/api/v1/upload', {
          method: 'POST',
          body: form2
        });
        if (res2.ok) {
          const json = await res2.json();
          const rawUrl = json?.data?.url;
          if (rawUrl) {
            return rawUrl.replace('https://tmpfiles.org/', 'https://tmpfiles.org/dl/');
          }

          localStorage.setItem(`bonka_ts_${key}`, String(now));
          if (syncChannel) {
            syncChannel.postMessage({ key, data, timestamp: now });

        const applySyncUpdate = (key, data) => {
          if (data === null || data === undefined) return;
          if (key === 'games' && Array.isArray(data)) setGames(data);
          if (key === 'cart' && Array.isArray(data)) setCart(data);
          if (key === 'orders' && Array.isArray(data)) setOrders(data);
          if (key === 'account_pool' && Array.isArray(data)) setAccountPool(data);
          if (key === 'promo_codes' && Array.isArray(data)) setPromoCodes(data);
          if (key === 'settings' && typeof data === 'object') {
            setStoreConfig((prev) => ({
              ...prev,
              ...data,
              storePageUrl: sanitizeMessengerLink(data.storePageUrl || prev.storePageUrl),
              messengerUrl: sanitizeMessengerLink(data.messengerUrl || data.storePageUrl || prev.messengerUrl)
            }));
          }
        };

        const handleStorageEvent = (e) => {
          if (!e.key || !e.key.startsWith('bonka_local_') || !e.newValue) return;
          const shortKey = e.key.replace('bonka_local_', '');
          try {
            const parsed = JSON.parse(e.newValue);
            applySyncUpdate(shortKey, parsed);
          } catch (err) {}
        };

        const handleBroadcastMessage = (e) => {
          if (e && e.data && e.data.key) {
            applySyncUpdate(e.data.key, e.data.data);
          }
        };

        window.addEventListener('storage', handleStorageEvent);
        if (syncChannel) {
          try {
            syncChannel.addEventListener('message', handleBroadcastMessage);
          } catch (e) {
            syncChannel.onmessage = handleBroadcastMessage;
          }
        }

        // Cross-device cloud sync check (runs on load & every 5 seconds)
        const syncFromCloud = async () => {
          for (const key of CLOUD_SYNC_KEYS) {
            const remote = await pullFromCloudSync(key);
            if (remote && remote.data !== undefined && remote.updatedAt) {
              const localTs = Number(localStorage.getItem(`bonka_ts_${key}`) || 0);
              if (remote.updatedAt > localTs) {
                localStorage.setItem(`bonka_local_${key}`, JSON.stringify(remote.data));
                localStorage.setItem(`bonka_ts_${key}`, String(remote.updatedAt));
                applySyncUpdate(key, remote.data);
              }
            }
          }
        };

        syncFromCloud();
        const intervalId = setInterval(syncFromCloud, 5000);

        return () => {
          clearInterval(intervalId);
          window.removeEventListener('storage', handleStorageEvent);
          if (syncChannel) {
            try {
              syncChannel.removeEventListener('message', handleBroadcastMessage);
            } catch (e) {
              syncChannel.onmessage = null;
            }
          }
        };
