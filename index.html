    const normalizeEgpPrice = (val, fallback = 950) => {
      const num = Number(val);
      if (!num || isNaN(num)) return fallback;
      if (num < 100) return Math.round((num * 38) / 25) * 25;
      return Math.round(num);
    };

    const formatEGP = (val, lang = 'ar') => {
      const amount = normalizeEgpPrice(val, 0);
      if (lang === 'en') {
        return `${amount.toLocaleString('en-US')} EGP`;
      }
      return `${amount.toLocaleString('ar-EG')} ج.م`;
    };

    // Updated Messenger link to https://m.me/358605444011590
    const DEFAULT_FB_PROFILE_URL = 'https://m.me/358605444011590';
    const DEFAULT_FB_MESSENGER_URL = 'https://m.me/358605444011590';
    const DEFAULT_ADMIN_PIN = 'BNK#9920$X';
    const SECRET_SEARCH_TRIGGER = '//bnk-root';

    // Helper to upgrade any legacy URLs in storage/database to the new Messenger URL
    const sanitizeMessengerLink = (url) => {
      if (
        !url ||
        url.includes('61563495661407') ||
        url === 'https://m.me/psvaultstore'
      ) {
        return DEFAULT_FB_MESSENGER_URL;
      }
      if (url.startsWith('m.me/')) {
        return `https://${url}`;
      }
      return url;
    };

    const generateVaultCredentials = (gameTitle, licenseType) => {
      const cleanSlug = gameTitle
        .toLowerCase()
        .replace(/[^a-z0-9]/g, '')
        .slice(0, 10);
      const randomDigits = Math.floor(1000 + Math.random() * 9000);
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
      let pass = "PSN#";
      for (let i = 0; i < 8; i++) {
        pass += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      const backupCode = `${Math.floor(100000 + Math.random() * 900000)}`;
      return {
        psnEmail: `${cleanSlug}.${licenseType.toLowerCase()}${randomDigits}@bonkastore-delivery.net`,
        psnPassword: pass,
        twoStepCode: backupCode,
        activationInstructions: licenseType === 'Primary'
          ? "سجل الدخول إلى هذا المستخدم الجديد على جهاز PS4/PS5 -> اذهب إلى الإعدادات > المستخدمون والحسابات > أخرى > مشاركة الجهاز واللعب دون اتصال -> اضغط 'تفعيل'. حمل اللعبة من المكتبة، ثم ارجع إلى حسابك الشخصي للعب!"
          : "سجل الدخول إلى هذا المستخدم الجديد على جهاز PS4/PS5 -> اختر 'عدم التفعيل' عند سؤالك عن مشاركة الجهاز -> حمل اللعبة من المكتبة -> العب دائماً من داخل هذا الحساب مباشرة مع اتصال الإنترنت."
      };
    };

      });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => {
          setToast(null);
        }, 3600);
      };

      // Helper to persist state in LocalStorage AND broadcast immediately to all open PC / Mobile windows
      const syncLocalState = (key, data) => {
        try {
          localStorage.setItem(`bonka_local_${key}`, JSON.stringify(data));
          if (syncChannel) {
            syncChannel.postMessage({ key, data, timestamp: Date.now() });
          }
        } catch (err) {
          console.error("Local sync error:", err);
        }
      };

      // Listen for real-time changes from Admin across any open tab/device window
      useEffect(() => {
        const applySyncUpdate = (key, data) => {
          if (!data) return;
          if (key === 'games') setGames(data);
          if (key === 'cart') setCart(data);
          if (key === 'orders') setOrders(data);
          if (key === 'account_pool') setAccountPool(data);
          if (key === 'settings') {
            setStoreConfig((prev) => ({
              ...prev,
              ...data,
              storePageUrl: sanitizeMessengerLink(data.storePageUrl),
              messengerUrl: sanitizeMessengerLink(data.messengerUrl || data.storePageUrl)
            }));
          }
        };

        const handleStorageEvent = (e) => {
          if (!e.key || !e.key.startsWith('bonka_local_') || !e.newValue) return;
          const shortKey = e.key.replace('bonka_local_', '');
          try {
            const parsed = JSON.parse(e.newValue);
            applySyncUpdate(shortKey, parsed);
          } catch (err) {
            console.error("Storage parse error:", err);
          }
        };

        const handleBroadcastMessage = (e) => {
          if (e.data && e.data.key) {
            applySyncUpdate(e.data.key, e.data.data);
          }
        };

        window.addEventListener('storage', handleStorageEvent);
        if (syncChannel) {
          syncChannel.addEventListener('message', handleBroadcastMessage);
        }

        return () => {
          window.removeEventListener('storage', handleStorageEvent);
          if (syncChannel) {
            syncChannel.removeEventListener('message', handleBroadcastMessage);
          }
        };
      }, []);

      useEffect(() => {
        document.title = lang === 'ar'
          ? 'Bonka Store | بونكا ستور لألعاب البلايستيشن PS4 & PS5'
          : 'Bonka Store | Official PS4 & PS5 Digital Accounts Store';
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
      }, [lang]);

      const handleAdminUnlockSubmit = (e) => {
        e.preventDefault();
        if (Date.now() < lockoutUntil) {
          const remainingSec = Math.ceil((lockoutUntil - Date.now()) / 1000);
          showToast(
            tr(`تم حظر المحاولات مؤقتاً. انتظر ${remainingSec} ثانية.`, `Too many attempts. Try again in ${remainingSec}s.`),
            'error'
          );
          return;
        }

        const configuredPin = (storeConfig.adminPin || DEFAULT_ADMIN_PIN).trim();
        if (adminPinInput.trim() === configuredPin) {
          setIsAdminAuthenticated(true);
          sessionStorage.setItem('bonka_admin_unlocked', 'true');
          setAdminPinModalOpen(false);
          setAdminPinInput('');
          setFailedPinAttempts(0);
          setActiveTab('admin');
          showToast(tr('تم التحقق من الكود السري وفتح لوحة الإدارة!', 'Secret Code Verified — Admin Unlocked!'));
        } else {
          const nextAttempts = failedPinAttempts + 1;
          setFailedPinAttempts(nextAttempts);
          setAdminPinInput('');
          if (nextAttempts >= 3) {
            setLockoutUntil(Date.now() + 60000);
            setAdminPinModalOpen(false);
            showToast(tr('تم إغلاق البوابة لمدة 60 ثانية بسبب محاولات خاطئة.', 'Locked for 60 seconds due to failed attempts.'), 'error');
          } else {
            showToast(tr('الكود السري غير صحيح!', 'Invalid Secret Code!'), 'error');
          }
        }
      };

      const handleAdminLogout = () => {
        setIsAdminAuthenticated(false);
        sessionStorage.removeItem('bonka_admin_unlocked');
        if (activeTab === 'admin') setActiveTab('store');
        setShowDevSimulatorBar(false);
        setPreviewDevice('pc');
        showToast(tr('تم قفل وضع الإدارة والعودة لواجهة العميل العامة.', 'Admin mode locked. Viewing public storefront.'), 'info');
      };

      // Auth Initialization (Firebase or Local Guest User)
      useEffect(() => {
        if (!hasValidFirebase) {
          let localUid = localStorage.getItem('bonka_local_uid');
          if (!localUid) {
            localUid = 'local_user_' + Math.random().toString(36).substring(2, 10);
            localStorage.setItem('bonka_local_uid', localUid);
          }
          setUser({ uid: localUid });
          setAuthReady(true);
          return;
        }

        const initAuth = async () => {
          try {
            if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
              await signInWithCustomToken(auth, window.__initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.error("Authentication initialization error:", err);
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setAuthReady(true);
        });
        return () => unsubscribe();
      }, []);

      // Data Synchronization (Firebase Firestore + LocalStorage Fallback)
      useEffect(() => {
        if (!authReady || !user) return;

        if (!hasValidFirebase) {
          const savedGames = JSON.parse(localStorage.getItem('bonka_local_games') || 'null');
          if (savedGames && savedGames.length > 0) {
            setGames(savedGames);
          } else {
            setGames(INITIAL_GAMES_SEED);
            syncLocalState('games', INITIAL_GAMES_SEED);
          }

          setCart(JSON.parse(localStorage.getItem('bonka_local_cart') || '[]'));
          setOrders(JSON.parse(localStorage.getItem('bonka_local_orders') || '[]'));
          setAccountPool(JSON.parse(localStorage.getItem('bonka_local_account_pool') || '[]'));
          const savedCfg = JSON.parse(localStorage.getItem('bonka_local_settings') || 'null');
          if (savedCfg) {
            const updatedCfg = {
              ...savedCfg,
              storePageUrl: sanitizeMessengerLink(savedCfg.storePageUrl),
              messengerUrl: sanitizeMessengerLink(savedCfg.messengerUrl || savedCfg.storePageUrl)
            };
            setStoreConfig((prev) => ({ ...prev, ...updatedCfg }));
            localStorage.setItem('bonka_local_settings', JSON.stringify(updatedCfg));
          }
          setLoadingData(false);
          return;

        // 1. Public Games Collection
        const gamesRef = collection(db, 'artifacts', appId, 'public', 'data', 'games');

        showToast(
          tr(

        );

      const addToCart = async (game, explicitLicenseType = null) => {
        if (!user) return;
        const licenseType = explicitLicenseType || getSelectedLicenseForGame(game.id);
        const unitPrice = licenseType === 'Primary' ? normalizeEgpPrice(game.primaryPrice, 1100) : normalizeEgpPrice(game.secondaryPrice, 650);
        const availableStock = licenseType === 'Primary' ? Number(game.primaryStock) : Number(game.secondaryStock);

        if (availableStock <= 0) {
          showToast(
            tr(
              `نفدت كمية الحسابات (${licenseType === 'Primary' ? 'الأساسي' : 'الثانوي'}) للعبة ${game.title} حالياً!`,
              `${licenseType} accounts for ${game.title} are currently out of stock!`
            ),
            'error'
          );
          return;
        }

        const cartItemId = `${game.id}_${licenseType}`;
        const existingItem = cart.find((item) => item.id === cartItemId);

        let updatedCart;
        if (existingItem) {
          if (existingItem.quantity + 1 > availableStock) {
            showToast(tr(`الحد الأقصى المتاح هو (${availableStock}) حسابات`, `Maximum available stock is (${availableStock}) accounts`), 'error');
            return;
          }
          updatedCart = cart.map(item => item.id === cartItemId ? { ...item, quantity: item.quantity + 1 } : item);
        } else {
          updatedCart = [...cart, {
            id: cartItemId,
            gameId: game.id,
            title: game.title,
            console: game.console,
            image: game.image,
            licenseType,
            price: unitPrice,
            retailPrice: normalizeEgpPrice(game.retailPrice, 3200),
            quantity: 1,
            addedAt: Date.now()
          }];

        setCart(updatedCart);
        syncLocalState('cart', updatedCart);

          showToast(
            tr(

              `Added ${game.title} (${licenseType}) to cart!`

          );
          return;

          const itemRef = doc(db, 'artifacts', appId, 'users', user.uid, 'cart', cartItemId);
          if (existingItem) {
            await updateDoc(itemRef, {
              quantity: existingItem.quantity + 1
            });

              gameId: game.id,
              title: game.title,
              console: game.console,
              image: game.image,
              licenseType,

              retailPrice: normalizeEgpPrice(game.retailPrice, 3200),

        const updated = newQty <= 0
          ? cart.filter(i => i.id !== cartItem.id)
          : cart.map(i => i.id === cartItem.id ? { ...i, quantity: newQty } : i);
        setCart(updated);
        syncLocalState('cart', updated);

        if (!hasValidFirebase) return;

        const itemRef = doc(db, 'artifacts', appId, 'users', user.uid, 'cart', cartItem.id);
        try {
          if (newQty <= 0) {
            await deleteDoc(itemRef);
          } else {
            await updateDoc(itemRef, { quantity: newQty });
          }
        } catch (err) {
          console.error("Error updating quantity:", err);
        }
      };

      const cartTotals = useMemo(() => {

        cart.forEach((item) => {

          const qty = Number(item.quantity) || 1;
          const price = liveGame
            ? (item.licenseType === 'Primary' ? normalizeEgpPrice(liveGame.primaryPrice, 1100) : normalizeEgpPrice(liveGame.secondaryPrice, 650))
            : normalizeEgpPrice(item.price, 750);
          const retail = liveGame
            ? normalizeEgpPrice(liveGame.retailPrice, 3200)
            : normalizeEgpPrice(item.retailPrice, 3200);
          subtotal += price * qty;
          retailTotal += retail * qty;
          count += qty;

          subtotal,
          retailTotal,
          totalSavings: Math.max(0, retailTotal - subtotal),

            tr('يرجى الموافقة على شروط استخدام الحساب الأساسي والثانوي أولاً.', 'Please agree to the Primary & Secondary account rules first.'),

        try {
          const orderNumber = `BNK-${Math.floor(100000 + Math.random() * 900000)}`;
          const deliveredAccounts = [];
          const usedPoolIds = new Set();

          for (const item of cart) {
            const qty = Number(item.quantity) || 1;
            const liveGame = games.find((g) => g.id === item.gameId);
            const activeUnitPrice = liveGame
              ? (item.licenseType === 'Primary' ? normalizeEgpPrice(liveGame.primaryPrice, 1100) : normalizeEgpPrice(liveGame.secondaryPrice, 650))
              : normalizeEgpPrice(item.price, 750);

            for (let i = 0; i < qty; i++) {
              const matchingPoolAcc = accountPool.find(
                (acc) =>
                  acc.gameId === item.gameId &&
                  acc.licenseType === item.licenseType &&
                  acc.status === 'available' &&
                  !usedPoolIds.has(acc.id)
              );

              if (matchingPoolAcc) {
                usedPoolIds.add(matchingPoolAcc.id);
                deliveredAccounts.push({
                  gameId: item.gameId,
                  title: liveGame?.title || item.title,
                  console: liveGame?.console || item.console,
                  image: liveGame?.image || item.image,
                  licenseType: item.licenseType,
                  pricePaid: activeUnitPrice,
                  psnEmail: matchingPoolAcc.psnEmail,
                  psnPassword: matchingPoolAcc.psnPassword,
                  twoStepCode: matchingPoolAcc.twoStepCode,
                  activationInstructions:
                    matchingPoolAcc.notes ||
                    generateVaultCredentials(liveGame?.title || item.title, item.licenseType).activationInstructions
                });

                if (hasValidFirebase) {
                  await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'account_pool', matchingPoolAcc.id), {
                    status: 'assigned',
                    assignedOrderNumber: orderNumber,
                    assignedToEmail: checkoutForm.customerEmail,
                    assignedAt: Date.now()
                  });
                }
              } else {
                const generated = generateVaultCredentials(liveGame?.title || item.title, item.licenseType);
                deliveredAccounts.push({
                  gameId: item.gameId,
                  title: liveGame?.title || item.title,
                  console: liveGame?.console || item.console,
                  image: liveGame?.image || item.image,
                  licenseType: item.licenseType,
                  pricePaid: activeUnitPrice,
                  ...generated
                });
              }
            }

            if (liveGame && hasValidFirebase) {
              const stockField = item.licenseType === 'Primary' ? 'primaryStock' : 'secondaryStock';
              const currentStock = Number(liveGame[stockField]) || 0;
              await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'games', item.gameId), {
                [stockField]: Math.max(0, currentStock - qty)
              });
            }

          gameTitle: targetGame.title,
          console: targetGame.console,
          licenseType: vaultForm.licenseType,
          psnEmail: vaultForm.psnEmail.trim(),
          psnPassword: vaultForm.psnPassword.trim(),

                            </span>
                            <span className="text-lg font-black text-purple-300">
                              {formatEGP(selectedGameModal.secondaryPrice, lang)}
                            </span>
                          </div>
                          <p className="text-xs text-slate-400">
                            {tr('العب مباشرة من الحساب المرسل لك مع اتصال الواي فاي. أرخص سعر اقتصادي.', 'Play on the delivered PSN profile with an internet connection.')}
                          </p>
                          <button
                            onClick={() => {
                              addToCart(selectedGameModal, 'Secondary');
                              setSelectedGameModal(null);
                            }}
                            className="w-full py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs mt-2"
                          >
                            {tr(`أضف حساب ثانوي (${formatEGP(selectedGameModal.secondaryPrice, lang)})`, `Add Secondary (${formatEGP(selectedGameModal.secondaryPrice, lang)})`)}
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* Admin Direct Credential Dispatch & Edit Modal */}
              {managingOrderModal && (
                <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
                  <form
                    onSubmit={handleSaveDispatchedCredentials}
                    className="w-full max-w-2xl rounded-3xl bg-slate-900 border border-indigo-500/40 p-6 sm:p-8 space-y-6 my-8 shadow-2xl"
                  >
                    <div className="flex items-center justify-between border-b border-white/10 pb-4">
                      <div>
                        <span className="text-[10px] font-bold uppercase tracking-wider text-indigo-400">
                          إرسال وتعديل الحساب يدوياً • طلب رقم {managingOrderModal.orderNumber}
                        </span>
                        <h3 className="text-xl font-black text-white">
                          إرسال أو تعديل بيانات حساب البلايستيشن للعميل {managingOrderModal.customerName}
                        </h3>
                      </div>
                      <button
                        type="button"
                        onClick={() => setManagingOrderModal(null)}
                        className="p-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white"
                      >
                        <X className="w-4 h-4" />
                      </button>
                    </div>

                    <div className="space-y-4 max-h-[60vh] overflow-y-auto pl-2">
                      {editableOrderAccounts.map((acc, idx) => (
                        <div
                          key={idx}
                          className="p-4 rounded-2xl bg-slate-950 border border-white/10 space-y-3"
                        >
                          <div className="flex items-center justify-between border-b border-white/10 pb-2">
                            <span className="font-bold text-white text-sm">
                              {acc.title} (حساب {acc.licenseType === 'Primary' ? 'أساسي' : 'ثانوي'})
                            </span>
                            <span className="text-xs text-slate-400">{acc.console}</span>
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div>
                              <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">
                                إيميل الحساب (PSN Email)
                              </label>
                              <input
                                type="text"
                                required
                                dir="ltr"
                                value={acc.psnEmail || ''}
                                onChange={(e) => handleUpdateOrderCredentialField(idx, 'psnEmail', e.target.value)}
                                className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-white/10 text-xs text-blue-300 font-mono"
                              />
                            </div>
                            <div>
                              <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">
                                الرقم السري (Password)
                              </label>
                              <input
                                type="text"
                                required
                                dir="ltr"
                                value={acc.psnPassword || ''}
                                onChange={(e) => handleUpdateOrderCredentialField(idx, 'psnPassword', e.target.value)}
                                className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-white/10 text-xs text-emerald-300 font-mono"
                              />
                            </div>
                            <div>
                              <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">
                                كود التحقق (2FA Code)
                              </label>
                              <input
                                type="text"
                                required
                                dir="ltr"
                                value={acc.twoStepCode || ''}
                                onChange={(e) => handleUpdateOrderCredentialField(idx, 'twoStepCode', e.target.value)}
                                className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-white/10 text-xs text-amber-300 font-mono"
                              />
                            </div>
                          </div>

                          <div>
                            <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">
                              تعليمات التفعيل للعميل
                            </label>
                            <textarea
                              rows={2}
                              value={acc.activationInstructions || ''}
                              onChange={(e) => handleUpdateOrderCredentialField(idx, 'activationInstructions', e.target.value)}
                              className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-white/10 text-xs text-slate-200"
                            />
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="flex justify-end gap-3 pt-2 border-t border-white/10">
                      <button
                        type="button"
                        onClick={() => setManagingOrderModal(null)}
                        className="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold"
                      >
                        إلغاء
                      </button>
                      <button
                        type="submit"
                        className="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-lg shadow-emerald-600/30 flex items-center gap-1.5"
                      >
                        <Unlock className="w-3.5 h-3.5" />
                        <span>تأكيد الطلب وإرسال البيانات لخزنة العميل</span>
                      </button>
                    </div>
                  </form>
                </div>
              )}

              {/* Admin PIN Authentication Modal */}
              {adminPinModalOpen && (
                <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
                  <form
                    onSubmit={handleAdminUnlockSubmit}
                    className="w-full max-w-sm rounded-3xl bg-slate-900 border border-indigo-500/40 p-6 space-y-5 shadow-2xl"
                  >
                    <div className="flex items-center justify-between border-b border-white/10 pb-3">
                      <div className="flex items-center gap-2.5">
                        <div className="w-10 h-10 rounded-2xl bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center">
                          <Lock className="w-5 h-5 text-indigo-400" />
                        </div>
                        <div>
                          <h3 className="font-black text-white text-base">
                            {tr('بوابة التوثيق المشفرة', 'Encrypted Security Gate')}
                          </h3>
                          <span className="text-[11px] text-slate-400">
                            {tr('مطلوب الكود السري الخاص بالمسؤول', 'Master Authorization Code Required')}
                          </span>
                        </div>
                      </div>
                      <button
                        type="button"
                        onClick={() => {
                          setAdminPinModalOpen(false);
                          setAdminPinInput('');
                        }}
                        className="p-1.5 rounded-xl bg-slate-800 text-slate-400 hover:text-white"
                      >
                        <X className="w-4 h-4" />
                      </button>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1.5">
                        {tr('أدخل الكود السري الخاص بك:', 'Enter Master Secret Code:')}
                      </label>
                      <input
                        type="password"
                        required
                        autoFocus
                        dir="ltr"
                        value={adminPinInput}
                        onChange={(e) => setAdminPinInput(e.target.value)}
                        placeholder="••••••••••"
                        className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-white/15 text-center text-lg font-mono tracking-widest text-white focus:outline-none focus:border-indigo-500"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs shadow-lg shadow-indigo-600/30"
                    >
                      {tr('تأكيد الكود السري', 'Verify Secret Code')}
                    </button>
                  </form>
                </div>
              )}

              {/* Legal & Store Policies Modal */}
              {legalModal && (
                <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
                  <div className="w-full max-w-lg rounded-3xl bg-slate-900 border border-white/15 p-6 space-y-4 shadow-2xl">
                    <div className="flex items-center justify-between border-b border-white/10 pb-3">
                      <h3 className="font-black text-white text-lg">
                        {legalModal === 'terms' && tr('شروط الاستخدام وضمان الحسابات', 'Terms of Service & Account Warranty')}
                        {legalModal === 'refund' && tr('سياسة الاستبدال والدعم الفني', 'Replacement & Support Policy')}
                        {legalModal === 'privacy' && tr('سياسة الخصوصية وأمان البيانات', 'Privacy & Security Policy')}
                      </h3>
                      <button
                        onClick={() => setLegalModal(null)}
                        className="p-1.5 rounded-xl bg-slate-800 text-slate-400 hover:text-white"
                      >
                        <X className="w-4 h-4" />
                      </button>
                    </div>

                    <div className="text-xs sm:text-sm text-slate-300 space-y-3 leading-relaxed">
                      {legalModal === 'terms' && (
                        <>
                          <p>{tr('1. جميع الألعاب المتوفرة في Bonka Store هي نسخ رقمية أصلية 100% من متجر بلايستيشن الرسمي.', '1. All games sold on Bonka Store are 100% official digital copies purchased from the PlayStation Store.')}</p>
                          <p>{tr('2. يمنع تماماً تغيير الإيميل أو الرقم السري أو إعدادات التحقق (2FA) الخاصة بالحساب المستلم لضمان استمرار الضمان مدى الحياة.', '2. Changing the PSN email, password, or 2FA settings on the delivered account is strictly prohibited to maintain your lifetime warranty.')}</p>
                          <p>{tr('3. الرخصة صالحة لجهاز بلايستيشن واحد فقط لكل طلب (PS4 أو PS5 حسب اختيارك).', '3. Each license is valid for one console activation per order.')}</p>
                        </>
                      )}
                      {legalModal === 'refund' && (
                        <>
                          <p>{tr('1. يتمتع العميل بضمان كامل وحقيقي طوال فترة استخدام الحساب طالما ملتزم بتعليمات التفعيل.', '1. Every order includes full warranty coverage as long as activation instructions are followed.')}</p>
                          <p>{tr('2. في حال واجهتك أي مشكلة في تسجيل الدخول أو التفعيل، تواصل معنا فوراً عبر واتساب (01205047037) أو ماسنجر فيسبوك ليقوم فريق الدعم بحلها أو استبدال الحساب لك فوراً.', '2. If you experience any login or activation issue, contact us via WhatsApp (01205047037) or Facebook Messenger for immediate support or account replacement.')}</p>
                        </>
                      )}
                      {legalModal === 'privacy' && (
                        <>
                          <p>{tr('1. يتم استخدام اسمك ورقم الواتساب والبريد الإلكتروني فقط لغرض تسليم بيانات الحساب وتأكيد الطلبات.', '1. Your name, WhatsApp number, and email are used strictly for order verification and digital PSN delivery.')}</p>
                          <p>{tr('2. لا نقوم بمشاركة بياناتك مع أي طرف ثالث.', '2. We never share or sell customer information to third parties.')}</p>
                        </>
                      )}
                    </div>

                    <div className="pt-2 flex justify-end">
                      <button
                        onClick={() => setLegalModal(null)}
                        className="px-5 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold"
                      >
                        {tr('فهمت ذلك', 'Got It')}
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Production Public Storefront Footer */}
              <footer className="relative z-10 border-t border-white/10 bg-slate-950/90 mt-16">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
                  <div className={`grid grid-cols-1 ${previewDevice === 'mobile' ? 'gap-6' : 'md:grid-cols-4 gap-8'}`}>
                    <div className="space-y-3 md:col-span-2">
                      <div className="flex items-center gap-2.5">
                        <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-700 flex items-center justify-center">
                          <Gamepad2 className="w-5 h-5 text-white" />
                        </div>
                        <span className="font-black text-lg text-white tracking-tight">BONKA STORE</span>
                      </div>
                      <p className="text-xs text-slate-400 max-w-md leading-relaxed">
                        {tr(
                          'متجر بونكا ستور (Bonka Store) المتخصص في بيع الألعاب الرقمية الأصلية لأجهزة PlayStation 4 و PlayStation 5 بنظام الحسابات الأساسية (Primary) والثانوية (Secondary) بأفضل الأسعار في مصر وبضمان كامل.',
                          'Bonka Store is Egypt’s premier destination for official PlayStation 4 & PlayStation 5 Primary and Secondary digital game accounts with instant delivery and full warranty.'
                        )}
                      </p>
                      <div className="flex flex-wrap items-center gap-2 pt-1">
                        <span className="px-2.5 py-1 rounded-lg bg-slate-900 border border-white/10 text-[11px] font-bold text-emerald-400">
                          Vodafone Cash
                        </span>
                        <span className="px-2.5 py-1 rounded-lg bg-slate-900 border border-white/10 text-[11px] font-bold text-purple-300">
                          InstaPay Egypt
                        </span>
                        <span className="px-2.5 py-1 rounded-lg bg-slate-900 border border-white/10 text-[11px] font-bold text-blue-300">
                          Visa / MasterCard
                        </span>
                      </div>
                    </div>

                    <div className="space-y-2.5">
                      <h4 className="text-xs font-extrabold uppercase tracking-wider text-white">
                        {tr('روابط وسياسات المتجر', 'Store Links & Policies')}
                      </h4>
                      <ul className="space-y-2 text-xs text-slate-400">
                        <li>
                          <button onClick={() => setActiveTab('guide')} className="hover:text-blue-400">
                            {tr('الفرق بين الحساب الأساسي والثانوي', 'Primary vs. Secondary Guide')}
                          </button>
                        </li>
                        <li>
                          <button onClick={() => setLegalModal('terms')} className="hover:text-blue-400">
                            {tr('شروط الاستخدام وضمان الحسابات', 'Terms & Lifetime Warranty')}
                          </button>
                        </li>
                        <li>
                          <button onClick={() => setLegalModal('refund')} className="hover:text-blue-400">
                            {tr('سياسة الاستبدال والدعم الفني', 'Replacement & Support Policy')}
                          </button>
                        </li>
                        <li>
                          <button onClick={() => setLegalModal('privacy')} className="hover:text-blue-400">
                            {tr('سياسة الخصوصية', 'Privacy Policy')}
                          </button>
                        </li>
                      </ul>
                    </div>

                    <div className="space-y-2.5">
                      <h4 className="text-xs font-extrabold uppercase tracking-wider text-white">
                        {tr('تواصل معنا لتأكيد الطلبات', 'Contact & Order Support')}
                      </h4>
                      <div className="space-y-2 text-xs text-slate-400">
                        <a
                          href={`https://wa.me/${formatWhatsAppPhone(storeConfig.whatsappNumber)}`}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="flex items-center gap-2 text-emerald-400 hover:text-emerald-300 font-bold"
                        >
                          <PhoneCall className="w-3.5 h-3.5" />
                          <span dir="ltr">WhatsApp: 01205047037</span>
                        </a>
                        <a
                          href={activeMessengerHref}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="flex items-center gap-2 text-blue-400 hover:text-blue-300 font-bold"
                        >
                          <ExternalLink className="w-3.5 h-3.5" />
                          <span>{tr('تواصل معنا عبر فيسبوك ماسنجر', 'Chat on Facebook Messenger')}</span>
                        </a>
                      </div>
                    </div>
                  </div>

                  <div className="pt-6 border-t border-white/10 flex flex-col sm:flex-row items-center justify-between gap-4 text-[11px] text-slate-500">
                    <p>
                      © {new Date().getFullYear()} BONKA STORE. {tr('جميع الحقوق محفوظة.', 'All rights reserved.')}
                    </p>
                    {isAdminAuthenticated && (
                      <div className="flex items-center gap-4">
                        <button
                          onClick={handleAdminLogout}
                          className="text-rose-400 hover:text-rose-300 flex items-center gap-1 font-bold"
                        >
                          <Lock className="w-3 h-3" />
                          <span>{tr('خروج من وضع الإدارة', 'Exit Admin Mode')}</span>
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              </footer>
            </div>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
