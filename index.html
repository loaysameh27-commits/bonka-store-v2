    // Compress uploaded receipt image to store cleanly in Firestore / LocalStorage
    const compressReceiptImage = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 850;
            const scale = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.72));
          };
          img.onerror = reject;
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    };

              localStorage.setItem('bonka_local_uid', localUid);
            }
          } catch (e) {}

          setAuthReady(true);
          return;

        const initAuth = async () => {
          try {
            if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
              await signInWithCustomToken(auth, window.__initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {}
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setAuthReady(true);
        });
        return () => unsubscribe();

          const liveGame = games.find((g) => g.id === item.gameId);
          const qty = Number(item.quantity) || 1;
          const price = liveGame
            ? (item.licenseType === 'Primary' ? normalizeEgpPrice(liveGame.primaryPrice, 1100) : normalizeEgpPrice(liveGame.secondaryPrice, 650))
            : normalizeEgpPrice(item.price, 750);
          const retail = liveGame
            ? normalizeEgpPrice(liveGame.retailPrice, 3200)
            : normalizeEgpPrice(item.retailPrice, 3200);
          subtotal += price * qty;
          retailTotal += retail * qty;
          count += qty;
        });

        let promoDiscount = 0;
        if (appliedPromo && subtotal > 0) {
          if (appliedPromo.discountType === 'percent') {
            promoDiscount = Math.round((subtotal * Number(appliedPromo.discountValue)) / 100);
          } else {
            promoDiscount = Math.min(subtotal, Number(appliedPromo.discountValue) || 0);
          }
        }

        const finalTotal = Math.max(0, subtotal - promoDiscount);

        return {
          subtotal,
          retailTotal,
          promoDiscount,
          finalTotal,
          totalSavings: Math.max(0, retailTotal - finalTotal),
          count
        };

        let parsedItems = [];

          parsedItems = JSON.parse(order.deliveredAccounts || '[]');

          parsedItems = [];
        }
        const itemsLines = parsedItems
          .map((item, idx) => `${idx + 1}. ${item.title} (${item.console} - ${item.licenseType === 'Primary' ? 'نسخة أساسي Primary' : 'نسخة ثانوي Secondary'}) - ${formatEGP(item.pricePaid, 'ar')}`)
          .join('\n');

        const promoLine = order.promoCode
          ? `🏷️ *كود الخصم:* ${order.promoCode} (-${formatEGP(order.discountAmount || 0, 'ar')})\n`
          : '';

        const message = `مرحباً إدارة متجر Bonka Store! 👋
أريد تأكيد طلبي لألعاب البلايستيشن:

🧾 *رقم الطلب:* ${order.orderNumber}
👤 *الاسم الكامل:* ${order.customerName}
📱 *رقم الواتساب:* ${order.whatsappNumber || 'غير مسجل'}
💳 *طريقة الدفع:* ${getPaymentMethodLabel(order.paymentMethod)}
${promoLine}💰 *الإجمالي المدفوع:* ${formatEGP(order.totalAmount, 'ar')}
📸 *صورة التحويل:* تم رفعها في الطلب (وسأرسلها لك هنا في الشات أيضاً للتأكيد)

📦 *الألعاب المطلوبة:*
${itemsLines}

يرجى تأكيد طلبي وفتح بيانات حساب البلايستيشن (QR Code)!`;

        const baseUrl = getWhatsAppBaseUrl(storeConfig.whatsappNumber);
        const separator = baseUrl.includes('?') ? '&' : '?';
        return `${baseUrl}${separator}text=${encodeURIComponent(message)}`;

        if (!user) return;
        const licenseType = explicitLicenseType || getSelectedLicenseForGame(game.id);
        const unitPrice = licenseType === 'Primary' ? normalizeEgpPrice(game.primaryPrice, 1100) : normalizeEgpPrice(game.secondaryPrice, 650);
        const availableStock = licenseType === 'Primary' ? Number(game.primaryStock) : Number(game.secondaryStock);

        if (availableStock <= 0) {
          showToast(
            tr(
              `نفدت كمية الحسابات (${licenseType === 'Primary' ? 'الأساسي' : 'الثانوي'}) للعبة ${game.title} حالياً!`,

            'error'
          );
          return;
        }

        const cartItemId = `${game.id}_${licenseType}`;
        const existingItem = cart.find((item) => item.id === cartItemId);

        let updatedCart;
        if (existingItem) {
          if (existingItem.quantity + 1 > availableStock) {
            showToast(tr(`الحد الأقصى المتاح هو (${availableStock}) حسابات`, `Maximum available stock is (${availableStock}) accounts`), 'error');
            return;

          updatedCart = cart.map(item => item.id === cartItemId ? { ...item, quantity: item.quantity + 1 } : item);

            console: game.console,

        const updated = newQty <= 0
          ? cart.filter(i => i.id !== cartItem.id)
          : cart.map(i => i.id === cartItem.id ? { ...i, quantity: newQty } : i);
        setCart(updated);
        syncLocalState('cart', updated);

        if (!hasValidFirebase) return;

        const itemRef = doc(db, 'artifacts', appId, 'users', user.uid, 'cart', cartItem.id);
        try {
          if (newQty <= 0) {
            await deleteDoc(itemRef);

          }

      const handleCompleteCheckout = async (e) => {

        try {

          const usedPoolIds = new Set();

          for (const item of cart) {
            const qty = Number(item.quantity) || 1;

            for (let i = 0; i < qty; i++) {

              if (matchingPoolAcc) {
                usedPoolIds.add(matchingPoolAcc.id);

                  title: liveGame?.title || item.title,
                  console: liveGame?.console || item.console,
                  image: liveGame?.image || item.image,
                  licenseType: item.licenseType,
                  pricePaid: activeUnitPrice,
                  psnEmail: matchingPoolAcc.psnEmail,
                  psnPassword: matchingPoolAcc.psnPassword,
                  twoStepCode: matchingPoolAcc.twoStepCode,
                  activationInstructions:
                    matchingPoolAcc.notes ||
                    generateVaultCredentials(liveGame?.title || item.title, item.licenseType).activationInstructions

                  console: liveGame?.console || item.console,
                  image: liveGame?.image || item.image,
                  licenseType: item.licenseType,
                  pricePaid: activeUnitPrice,

            const cartItemSecondary = cart.find(c => c.gameId === g.id && c.licenseType === 'Secondary');

              ...g,

              secondaryStock: cartItemSecondary ? Math.max(0, Number(g.secondaryStock) - cartItemSecondary.quantity) : g.secondaryStock
            };

        let nextGames;
        const targetId = editingGameId || `${(payload.title.toLowerCase().replace(/[^a-z0-9]/g, '-') || 'game')}-${Date.now().toString().slice(-4)}`;

                          <input
                            type="text"
                            value={promoInput}
                            onChange={(e) => setPromoInput(e.target.value)}
                            placeholder={tr('أدخل كود الخصم', 'Enter promo code')}
                            className="w-full px-3 py-2 rounded-xl bg-[#050811] border border-white/10 text-xs text-white text-right placeholder-slate-500 focus:outline-none focus:border-cyan-400"
                          />
                        </div>

                        {appliedPromo && (
                          <div className="flex items-center justify-between text-xs px-2 text-emerald-400 font-bold">
                            <button onClick={() => setAppliedPromo(null)} className="text-rose-400 text-[11px] hover:underline">
                              {tr('إلغاء الكود', 'Remove')}
                            </button>
                            <span>✓ كود الخصم مفعل: {appliedPromo.code} (-{formatEGP(cartTotals.promoDiscount, lang)})</span>
                          </div>
                        )}

                        {/* Summary Lines */}
                        <div className="space-y-1.5 pt-1 text-xs">
                          <div className="flex items-center justify-between text-slate-400 font-semibold">
                            <span dir="ltr">EGP {cartTotals.subtotal.toFixed(2)}</span>
                            <span>{tr('المجموع الفرعي', 'Subtotal')}</span>
                          </div>
                          {cartTotals.promoDiscount > 0 && (
                            <div className="flex items-center justify-between text-emerald-400 font-bold">
                              <span dir="ltr">- EGP {cartTotals.promoDiscount.toFixed(2)}</span>
                              <span>{tr('قيمة الخصم', 'Promo Discount')}</span>
                            </div>
                          )}
                          <div className="flex items-center justify-between text-slate-400 font-semibold">
                            <span dir="ltr">EGP 0.00</span>
                            <span>GST / VAT (0%)</span>
                          </div>
                          <div className="flex items-center justify-between pt-2 border-t border-white/10 text-base font-black">
                            <span className="text-cyan-400 text-lg" dir="ltr">EGP {cartTotals.finalTotal.toFixed(2)}</span>
                            <span className="text-white">{tr('المجموع الكلي', 'Total')}</span>
                          </div>
                        </div>

                        {/* Proceed to Checkout Button */}
                        <button
                          onClick={() => {
                            setCartOpen(false);
                            setCheckoutModalOpen(true);
                          }}
                          className="w-full py-3.5 rounded-2xl bg-[#0c243c] hover:bg-cyan-600 border border-cyan-500/40 text-cyan-200 hover:text-slate-950 font-black text-sm flex items-center justify-center gap-2 transition-all shadow-lg"
                        >
                          <ShieldCheck className="w-4 h-4" />
                          <span>{tr('إتمام الطلب', 'Complete Order')}</span>
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* ================================================================= */}
              {/* CHECKOUT MODAL (Matches your screenshot with Transfer & Upload)   */}
              {/* ================================================================= */}
              {checkoutModalOpen && (
                <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
                  <div className="w-full max-w-lg rounded-3xl p-6 sm:p-7 space-y-5 my-8 bg-[#050912] border border-cyan-500/30 shadow-[0_0_60px_rgba(6,182,212,0.15)]">
                    {/* Header */}
                    <div className="flex items-center justify-between border-b border-white/10 pb-4">
                      <button onClick={() => setCheckoutModalOpen(false)} className="p-2 rounded-xl bg-slate-900 border border-white/10 text-slate-400 hover:text-white">
                        <X className="w-4 h-4" />
                      </button>
                      <div className="flex items-center gap-3">
                        <div className="text-right">
                          <h3 className="text-xl font-black text-white">{tr('إتمام طلبك', 'Complete Your Order')}</h3>
                          <span className="text-xs text-slate-400">{tr('أدخل بياناتك لتأكيد طلبك', 'Enter your details to confirm')}</span>
                        </div>
                        <div className="w-11 h-11 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400">
                          <MessageCircle className="w-5 h-5" />
                        </div>
                      </div>
                    </div>

                    <form onSubmit={handleCompleteCheckout} className="space-y-5">
                      {/* Payment Method Tabs (Switchable directly inside Checkout too) */}
                      <div className="space-y-2">
                        <div className="grid grid-cols-3 gap-2">
                          {paymentMethodsList.map((pm) => (
                            <button
                              type="button"
                              key={pm.id}
                              onClick={() => setCheckoutForm({ ...checkoutForm, paymentMethod: pm.id })}
                              className={`py-2.5 px-2 rounded-xl text-xs font-black border transition-all flex items-center justify-center gap-1.5 ${
                                checkoutForm.paymentMethod === pm.id
                                  ? 'bg-cyan-500/15 border-cyan-400 text-cyan-300 shadow-md'
                                  : 'bg-slate-950 border-white/10 text-slate-400 hover:text-white'
                              }`}
                            >
                              <span className={`w-2 h-2 rounded-full ${pm.dotColor}`} />
                              <span>{pm.shortAr}</span>
                            </button>
                          ))}
                        </div>

                        {/* Selected Payment Banner */}
                        <div className="px-4 py-3 rounded-2xl bg-[#081221] border border-cyan-500/30 flex items-center justify-end gap-2 text-xs sm:text-sm font-bold">
                          <span className="text-cyan-400 font-black">{selectedPaymentObj.titleAr}</span>
                          <span className="text-slate-300">{tr('طريقة الدفع المختارة:', 'Selected Payment:')}</span>
                          <Zap className="w-4 h-4 text-cyan-400" />
                        </div>
                      </div>

                      {/* Transfer To Box (حول الدفع إلى) */}
                      <div className="p-4 rounded-2xl bg-[#070e1b] border border-cyan-500/25 space-y-2">
                        <span className="block text-[11px] font-bold text-cyan-400 text-right">
                          {tr('حول الدفع إلى', 'Transfer Payment To')}
                        </span>

                        <div className="p-4 rounded-xl bg-[#040811] border border-white/10 flex items-center justify-between gap-3">
                          <div className="flex flex-col gap-2 shrink-0">
                            <button
                              type="button"
                              onClick={() => {
                                copyTextToClipboard(selectedPaymentObj.transferValue, 'checkout_payment_copy');
                                showToast(tr('تم نسخ رقم / رابط التحويل!', 'Copied transfer number/link!'));
                              }}
                              className="px-3.5 py-2 rounded-xl bg-cyan-500/15 hover:bg-cyan-500/25 border border-cyan-400/40 text-cyan-300 text-xs font-bold flex items-center gap-1.5 transition-all"
                            >
                              {copiedId === 'checkout_payment_copy' ? <Check className="w-3.5 h-3.5" /> : <Copy className="w-3.5 h-3.5" />}
                              <span>{copiedId === 'checkout_payment_copy' ? tr('تم النسخ', 'Copied') : 'Copy'}</span>
                            </button>

                            {selectedPaymentObj.isUrl && (
                              <a
                                href={selectedPaymentObj.transferValue}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="px-3 py-1.5 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/40 text-emerald-300 text-[11px] font-bold flex items-center justify-center gap-1"
                              >
                                <ExternalLink className="w-3 h-3" />
                                <span>{tr('فتح الرابط', 'Open Link')}</span>
                              </a>
                            )}
                          </div>

                          <div className="text-right min-w-0 flex-1">
                            <span className="text-xs text-slate-400 font-bold block">{selectedPaymentObj.titleAr}</span>
                            <span
                              dir="ltr"
                              className="font-mono font-black text-base sm:text-lg text-cyan-400 tracking-wide block break-all my-0.5"
                            >
                              {selectedPaymentObj.transferValue}
                            </span>
                            <span className="text-xs font-bold text-emerald-400 flex items-center justify-end gap-1">
                              <span>{tr('اسم المستلم:', 'Recipient:')} {selectedPaymentObj.recipientName}</span>
                              <User className="w-3.5 h-3.5" />
                            </span>
                          </div>
                        </div>
                      </div>

                      {/* Full Name */}
                      <div className="space-y-1.5">
                        <label className="block text-xs font-bold text-slate-300 text-right">
                          {tr('الاسم الكامل', 'Full Name')} <span className="text-rose-500">*</span>
                        </label>
                        <div className="relative">
                          <input
                            type="text"
                            required
                            value={checkoutForm.customerName}
                            onChange={(e) => setCheckoutForm({ ...checkoutForm, customerName: e.target.value })}
                            placeholder={tr('أدخل اسمك الكامل', 'Enter your full name')}
                            className="w-full px-4 py-3 pr-10 rounded-2xl bg-[#080d1a] border border-white/15 text-sm text-white text-right placeholder-slate-500 focus:outline-none focus:border-cyan-400"
                          />
                          <User className="w-4 h-4 text-slate-500 absolute right-3.5 top-1/2 -translate-y-1/2" />
                        </div>
                      </div>

                      {/* WhatsApp Number */}
                      <div className="space-y-1.5">
                        <label className="block text-xs font-bold text-slate-300 text-right">
                          {tr('رقم الواتساب للتواصل واستلام الحساب', 'WhatsApp Number')} <span className="text-rose-500">*</span>
                        </label>
                        <input
                          type="tel"
                          required
                          dir="ltr"
                          value={checkoutForm.whatsappNumber}
                          onChange={(e) => setCheckoutForm({ ...checkoutForm, whatsappNumber: e.target.value })}
                          placeholder="01012345678"
                          className="w-full px-4 py-3 rounded-2xl bg-[#080d1a] border border-white/15 text-sm text-white font-mono text-right placeholder-slate-500 focus:outline-none focus:border-cyan-400"
                        />
                      </div>

                      {/* Payment Confirmation Screenshot Upload (صورة الدفع) */}
                      <div className="space-y-2">
                        <label className="block text-xs font-bold text-slate-300 text-right">
                          {tr('صورة الدفع', 'Payment Screenshot')} <span className="text-rose-500">*</span>
                        </label>

                        <div className="px-4 py-2.5 rounded-xl bg-[#081221] border border-cyan-500/25 text-xs text-slate-300 flex items-center justify-end gap-2">
                          <span>{tr('سيتم حفظ الصورة وإرسال تفاصيلها مع الطلب في واتساب أو ماسنجر', 'Photo will be attached to your order for WhatsApp / Messenger')}</span>
                          <Upload className="w-4 h-4 text-cyan-400 shrink-0" />
                        </div>

                        <input
                          ref={fileInputRef}
                          type="file"
                          accept="image/png,image/jpeg,image/webp"
                          onChange={handleReceiptFileChange}
                          className="hidden"
                        />

                        <div
                          onClick={() => fileInputRef.current?.click()}
                          className="cursor-pointer rounded-2xl border-2 border-dashed border-cyan-500/35 hover:border-cyan-400 bg-[#070d19] p-6 text-center space-y-3 transition-all"
                        >
                          {checkoutForm.receiptImage ? (
                            <div className="space-y-2">
                              <img
                                src={checkoutForm.receiptImage}
                                alt="Receipt Preview"
                                className="w-32 h-32 object-cover mx-auto rounded-xl border border-cyan-400/50 shadow-lg"
                              />
                              <p className="text-xs font-bold text-emerald-400">
                                ✓ {checkoutForm.receiptFileName || tr('تم اختيار صورة التحويل بنجاح', 'Screenshot attached')}
                              </p>
                              <span className="inline-block px-4 py-1.5 rounded-xl bg-slate-800 text-xs text-cyan-300 font-bold">
                                {tr('تغيير الصورة', 'Change Photo')}
                              </span>
                            </div>
                          ) : (
                            <>
                              <div className="w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center mx-auto text-cyan-400">
                                <Upload className="w-6 h-6" />
                              </div>
                              <div>
                                <p className="text-sm font-black text-white">{tr('ارفع صورة تأكيد الدفع', 'Upload Payment Confirmation Screenshot')}</p>
                                <p className="text-[11px] text-slate-400 mt-0.5">PNG, JPG, WEBP • Click or drag & drop</p>
                              </div>
                              <button
                                type="button"
                                className="px-5 py-2 rounded-xl bg-[#0c243c] border border-cyan-500/40 text-cyan-300 text-xs font-bold hover:bg-cyan-600 hover:text-slate-950 transition-all"
                              >
                                {tr('اختر صورة', 'Choose Image')}
                              </button>
                            </>
                          )}
                        </div>
                      </div>

                      {/* Order Summary Box */}
                      <div className="p-4 rounded-2xl bg-[#080d1a] border border-white/10 space-y-2">
                        <span className="block text-xs font-bold text-slate-400 text-right">{tr('ملخص الطلب', 'Order Summary')}</span>
                        {appliedPromo && (
                          <div className="flex items-center justify-between text-xs text-emerald-400 font-bold">
                            <span>-{formatEGP(cartTotals.promoDiscount, lang)}</span>
                            <span>كود الخصم ({appliedPromo.code})</span>
                          </div>
                        )}
                        <div className="flex items-center justify-between pt-1">
                          <span className="text-xl font-black text-cyan-400">{formatEGP(cartTotals.finalTotal, lang)}</span>
                          <span className="text-xs text-slate-300 font-bold">{tr('الإجمالي المطلوب تحويله:', 'Total to Transfer:')}</span>
                        </div>
                      </div>

                      <button
                        type="submit"
                        disabled={submittingOrder}
                        className="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black text-sm shadow-xl transition-all"
                      >
                        {submittingOrder
                          ? tr('جاري تسجيل الطلب...', 'Submitting Order...')
                          : tr(`تأكيد الطلب وإرسال التحويل (${formatEGP(cartTotals.finalTotal, lang)})`, `Confirm Order (${formatEGP(cartTotals.finalTotal, lang)})`)}
                      </button>
                    </form>
                  </div>
                </div>
              )}

              {/* Game Details Modal */}
              {selectedGameModal && (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
                  <div className="w-full max-w-2xl rounded-3xl bg-slate-900 border border-white/15 overflow-hidden shadow-2xl my-8">
                    <div className="relative h-64 bg-slate-950">
                      <img src={selectedGameModal.image} alt={selectedGameModal.title} className="w-full h-full object-cover opacity-80" />
                      <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/40 to-transparent" />
                      <div className="absolute top-4 left-4">
                        <button onClick={() => setSelectedGameModal(null)} className="p-2 rounded-xl bg-slate-950/80 text-slate-300">
                          <X className="w-5 h-5" />
                        </button>
                      </div>
                      <div className="absolute bottom-4 left-6 right-6">
                        <span className="px-2.5 py-1 rounded-lg text-xs font-black bg-blue-600 text-white">{selectedGameModal.console}</span>
                        <h3 className="text-2xl font-black text-white mt-2">{selectedGameModal.title}</h3>
                      </div>
                    </div>

                    <div className="p-6 space-y-6">
                      <p className="text-sm text-slate-300 leading-relaxed">{selectedGameModal.description}</p>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <button
                          onClick={() => { addToCart(selectedGameModal, 'Primary'); setSelectedGameModal(null); }}
                          className="p-4 rounded-2xl bg-blue-950/40 border border-blue-500/30 text-right hover:border-blue-400"
                        >
                          <div className="flex justify-between font-bold text-white text-sm">
                            <span>{tr('حساب أساسي', 'Primary')}</span>
                            <span className="text-blue-300">{formatEGP(selectedGameModal.primaryPrice, lang)}</span>
                          </div>
                        </button>
                        <button
                          onClick={() => { addToCart(selectedGameModal, 'Secondary'); setSelectedGameModal(null); }}
                          className="p-4 rounded-2xl bg-purple-950/40 border border-purple-500/30 text-right hover:border-purple-400"
                        >
                          <div className="flex justify-between font-bold text-white text-sm">
                            <span>{tr('حساب ثانوي', 'Secondary')}</span>
                            <span className="text-purple-300">{formatEGP(selectedGameModal.secondaryPrice, lang)}</span>
                          </div>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* Admin Credential Dispatch Modal */}
              {managingOrderModal && (
                <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
                  <form onSubmit={handleSaveDispatchedCredentials} className="w-full max-w-2xl rounded-3xl bg-slate-900 border border-indigo-500/40 p-6 sm:p-8 space-y-6 my-8 shadow-2xl">
                    <div className="flex items-center justify-between border-b border-white/10 pb-4">
                      <h3 className="text-xl font-black text-white">{tr('إرسال أو تعديل الـ QR Code للطلب', 'Dispatch QR Code')}</h3>
                      <button type="button" onClick={() => setManagingOrderModal(null)} className="p-2 rounded-xl bg-slate-800 text-slate-400">
                        <X className="w-4 h-4" />
                      </button>
                    </div>

                    <div className="space-y-4 max-h-[60vh] overflow-y-auto pl-2">
                      {editableOrderAccounts.map((acc, idx) => (
                        <div key={idx} className="p-4 rounded-2xl bg-slate-950 border border-white/10 space-y-3">
                          <h4 className="font-bold text-white text-sm">{acc.title} ({acc.licenseType})</h4>
                          <div>
                            <label className="block text-[10px] uppercase text-slate-400 mb-1">رابط الـ QR Code / البيانات</label>
                            <input
                              type="text"
                              required
                              dir="ltr"
                              value={acc.psnEmail || ''}
                              onChange={(e) => handleUpdateOrderCredentialField(idx, 'psnEmail', e.target.value)}
                              className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-white/10 text-xs text-blue-300 font-mono"
                            />
                          </div>
                          <div className="grid grid-cols-2 gap-2">
                            <input
                              type="text"
                              required
                              dir="ltr"
                              value={acc.psnPassword || ''}
                              onChange={(e) => handleUpdateOrderCredentialField(idx, 'psnPassword', e.target.value)}
                              placeholder="رمز الدخول"
                              className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-white/10 text-xs text-emerald-300 font-mono"
                            />
                            <input
                              type="text"
                              required
                              dir="ltr"
                              value={acc.twoStepCode || ''}
                              onChange={(e) => handleUpdateOrderCredentialField(idx, 'twoStepCode', e.target.value)}
                              placeholder="2FA Code"
                              className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-white/10 text-xs text-amber-300 font-mono"
                            />
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="flex justify-end gap-3 pt-2 border-t border-white/10">
                      <button type="button" onClick={() => setManagingOrderModal(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">إلغاء</button>
                      <button type="submit" className="px-6 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">إرسال الـ QR Code للعميل</button>
                    </div>
                  </form>
                </div>
              )}

              {/* Admin PIN Modal */}
              {adminPinModalOpen && (
                <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
                  <form onSubmit={handleAdminUnlockSubmit} className="w-full max-w-sm rounded-3xl bg-slate-900 border border-indigo-500/40 p-6 space-y-5 shadow-2xl">
                    <div className="flex items-center justify-between border-b border-white/10 pb-3">
                      <h3 className="font-black text-white text-base">{tr('بوابة الدخول للإدارة', 'Admin Gate')}</h3>
                      <button type="button" onClick={() => setAdminPinModalOpen(false)} className="p-1.5 rounded-xl bg-slate-800 text-slate-400">
                        <X className="w-4 h-4" />
                      </button>
                    </div>
                    <input
                      type="password"
                      required
                      autoFocus
                      dir="ltr"
                      value={adminPinInput}
                      onChange={(e) => setAdminPinInput(e.target.value)}
                      placeholder="الكود السري"
                      className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-white/15 text-center text-lg font-mono text-white"
                    />
                    <button type="submit" className="w-full py-3 rounded-xl bg-indigo-600 text-white font-black text-xs">
                      {tr('دخول', 'Unlock')}
                    </button>
                  </form>
                </div>
              )}

              {/* Footer */}
              <footer className="relative z-10 border-t border-white/10 bg-slate-950/90 mt-16">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 text-center text-xs text-slate-500">
                  <p>© {new Date().getFullYear()} BONKA STORE. {tr('جميع الحقوق محفوظة.', 'All rights reserved.')}</p>
                </div>
              </footer>
            </div>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
